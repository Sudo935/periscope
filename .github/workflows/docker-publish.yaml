name: Build, scan, and release

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ["[0-9]+.[0-9]+.[0-9]+"]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  validate:
    name: Validate source and chart
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Lint chart
        run: helm lint deploy/helm/mariner

      - name: Scan source and chart
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          skip-dirs: deploy/kustomize/local
          helm-values: .github/trivy-helm-values.yaml
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 1

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Scan frontend packages
        working-directory: frontend
        run: npm ci && npm audit --audit-level=high

  build-quarantine:
    name: Build and scan quarantine image
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.image.outputs.digest }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: type=raw,value=quarantine-${{ github.sha }}

      - name: Build and publish quarantine image
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan quarantine image
        if: github.event_name != 'pull_request'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.image.outputs.digest }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 1

  publish-release:
    name: Sign, promote, and publish chart
    runs-on: ubuntu-latest
    needs: [validate, build-quarantine]
    if: github.event_name != 'pull_request'
    outputs:
      published-digest: ${{ needs.build-quarantine.outputs.digest }}
    permissions:
      contents: read
      packages: write
      security-events: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign quarantine image
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          DIGEST: ${{ needs.build-quarantine.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Promote image digest
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          DIGEST: ${{ needs.build-quarantine.outputs.digest }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$REF" = "refs/heads/$DEFAULT_BRANCH" ]; then
            target_tag="latest"
          elif [[ "$REF" == refs/tags/* ]]; then
            if [[ ! "$REF_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Release tag must be plain semver x.y.z: $REF_NAME" >&2
              exit 1
            fi
            target_tag="$REF_NAME"
          else
            echo "No production promotion for $REF"
            exit 0
          fi
          docker buildx imagetools create --tag "${IMAGE}:${target_tag}" "${IMAGE}@${DIGEST}"

      - name: Package and publish chart
        if: startsWith(github.ref, 'refs/tags/')
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          chart_version="${VERSION}"
          helm package deploy/helm/mariner --version "$chart_version" --app-version "$chart_version"
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm push "mariner-${chart_version}.tgz" "oci://ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/charts"

  prune-registry:
    name: Prune GHCR images and signatures
    runs-on: ubuntu-latest
    needs: publish-release
    if: github.event_name != 'pull_request'
    permissions:
      packages: write
    env:
      REGISTRY: ghcr.io
      OWNER: ${{ github.repository_owner }}
      PACKAGE_NAME: ${{ github.event.repository.name }}
      CURRENT_DIGEST: ${{ needs.publish-release.outputs.published-digest }}
      KEEP_SEMVER_COUNT: "5"
    steps:
      - name: Install ORAS
        uses: oras-project/setup-oras@v1

      - name: Prune stale GHCR versions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 <<'PY'
          import json
          import os
          import re
          import subprocess

          owner = os.environ["OWNER"]
          package = os.environ["PACKAGE_NAME"]
          image = f"{os.environ['REGISTRY']}/{owner}/{package}"
          current_digest = os.environ.get("CURRENT_DIGEST", "")
          keep_semver_count = int(os.environ.get("KEEP_SEMVER_COUNT", "5"))

          def gh(path, method="GET"):
              command = ["gh", "api", "-H", "Accept: application/vnd.github+json", "-H", "X-GitHub-Api-Version: 2022-11-28"]
              if method != "GET":
                  command.extend(["-X", method])
              command.append(path)
              return subprocess.run(command, text=True, capture_output=True)

          def package_base():
              org = gh(f"/orgs/{owner}")
              if org.returncode == 0:
                  return f"/orgs/{owner}/packages/container/{package}/versions"
              return f"/users/{owner}/packages/container/{package}/versions"

          base = package_base()
          versions = []
          page = 1
          while True:
              result = gh(f"{base}?per_page=100&page={page}")
              result.check_returncode()
              batch = json.loads(result.stdout)
              if not batch:
                  break
              versions.extend(batch)
              page += 1

          semver = re.compile(r"^\d+\.\d+\.\d+(?:[-+][0-9A-Za-z.-]+)?$")
          artifact = re.compile(r"^sha256-([0-9a-f]{64})\.")

          def tags(version):
              return set(version.get("metadata", {}).get("container", {}).get("tags", []) or [])

          release_tags = sorted(
              {tag for version in versions for tag in tags(version) if semver.match(tag)},
              reverse=True,
          )[:keep_semver_count]
          keep_tags = {"latest", "main", *release_tags}
          current_hex = current_digest.removeprefix("sha256:")
          keep_ids = set()
          keep_digests = {current_hex} if current_hex else set()

          for version in versions:
              version_tags = tags(version)
              digest = version.get("name", "")
              digest_hex = digest.removeprefix("sha256:")
              if version_tags & keep_tags or digest_hex in keep_digests:
                  keep_ids.add(version["id"])
                  if digest_hex:
                      keep_digests.add(digest_hex)

          for tag in keep_tags:
              manifest = subprocess.run(["oras", "manifest", "fetch", f"{image}:{tag}"], text=True, capture_output=True)
              if manifest.returncode != 0:
                  continue
              try:
                  document = json.loads(manifest.stdout)
              except json.JSONDecodeError:
                  continue
              for child in document.get("manifests", []) or []:
                  child_digest = child.get("digest", "").removeprefix("sha256:")
                  if child_digest:
                      keep_digests.add(child_digest)

          for version in versions:
              digest = version.get("name", "").removeprefix("sha256:")
              if digest in keep_digests:
                  keep_ids.add(version["id"])

          for version in versions:
              subjects = {match.group(1) for tag in tags(version) if (match := artifact.match(tag))}
              if subjects & keep_digests:
                  keep_ids.add(version["id"])

          deleted = 0
          for version in versions:
              if version["id"] in keep_ids:
                  continue
              result = gh(f"{base}/{version['id']}", method="DELETE")
              if result.returncode != 0:
                  raise RuntimeError(result.stderr or result.stdout)
              deleted += 1

          print(f"Kept {len(keep_ids)} GHCR versions; deleted {deleted} stale versions")
          PY

  prune-charts:
    name: Prune GHCR Helm chart versions
    runs-on: ubuntu-latest
    needs: publish-release
    if: github.event_name != 'pull_request' && startsWith(github.ref, 'refs/tags/')
    permissions:
      packages: write
    env:
      OWNER: ${{ github.repository_owner }}
      PACKAGE_NAME: ${{ github.event.repository.name }}
      KEEP_SEMVER_COUNT: "5"
    steps:
      - name: Prune stale chart versions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 <<'PY'
          import json
          import os
          import re
          import subprocess
          from urllib.parse import quote

          owner = os.environ["OWNER"]
          package = quote(f"charts/{os.environ['PACKAGE_NAME']}", safe="")
          keep_count = int(os.environ.get("KEEP_SEMVER_COUNT", "5"))

          def gh(path, method="GET"):
              command = ["gh", "api", "-H", "Accept: application/vnd.github+json", "-H", "X-GitHub-Api-Version: 2022-11-28"]
              if method != "GET":
                  command.extend(["-X", method])
              command.append(path)
              return subprocess.run(command, text=True, capture_output=True)

          org = gh(f"/orgs/{owner}")
          prefix = f"/orgs/{owner}" if org.returncode == 0 else f"/users/{owner}"
          base = f"{prefix}/packages/container/{package}/versions"
          versions = []
          page = 1
          while True:
              result = gh(f"{base}?per_page=100&page={page}")
              result.check_returncode()
              batch = json.loads(result.stdout)
              if not batch:
                  break
              versions.extend(batch)
              page += 1

          semver = re.compile(r"^\d+\.\d+\.\d+(?:[-+][0-9A-Za-z.-]+)?$")

          def tags(version):
              return set(version.get("metadata", {}).get("container", {}).get("tags", []) or [])

          keep_tags = {
              tag
              for tag in sorted(
                  {tag for version in versions for tag in tags(version) if semver.match(tag)},
                  reverse=True,
              )[:keep_count]
          }
          keep_ids = {version["id"] for version in versions if tags(version) & keep_tags}
          deleted = 0
          for version in versions:
              if version["id"] in keep_ids:
                  continue
              result = gh(f"{base}/{version['id']}", method="DELETE")
              if result.returncode != 0:
                  raise RuntimeError(result.stderr or result.stdout)
              deleted += 1
          print(f"Kept chart tags: {', '.join(sorted(keep_tags, reverse=True)) or '<none>'}; deleted {deleted} stale chart versions")
          PY
