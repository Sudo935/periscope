name: Build, scan, and release

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ["v*.*.*"]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-scan-release:
    runs-on: ubuntu-latest
    outputs:
      published-digest: ${{ steps.image.outputs.digest }}
    permissions:
      contents: read
      packages: write
      security-events: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=quarantine-${{ github.sha }}

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Build and publish quarantine image
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan source and chart
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 1

      - name: Scan quarantine image
        if: github.event_name != 'pull_request'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.image.outputs.digest }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 1

      - name: Sign quarantine image
        if: github.event_name != 'pull_request'
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Promote image digest
        if: github.event_name != 'pull_request'
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          DIGEST: ${{ steps.image.outputs.digest }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$REF" = "refs/heads/$DEFAULT_BRANCH" ]; then
            target_tag="latest"
          elif [[ "$REF" == refs/tags/v* ]]; then
            target_tag="${REF_NAME#v}"
          else
            echo "No production promotion for $REF"
            exit 0
          fi
          docker buildx imagetools create --tag "${IMAGE}:${target_tag}" "${IMAGE}@${DIGEST}"

      - name: Lint chart
        run: helm lint deploy/helm/mariner

      - name: Package and publish chart
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          chart_version="${VERSION#v}"
          helm package deploy/helm/mariner --version "$chart_version" --app-version "$chart_version"
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm push "mariner-${chart_version}.tgz" "oci://ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/charts"

  prune-registry:
    name: Prune GHCR images and signatures
    runs-on: ubuntu-latest
    needs: build-scan-release
    if: github.event_name != 'pull_request'
    permissions:
      packages: write
    env:
      REGISTRY: ${{ env.REGISTRY }}
      OWNER: ${{ github.repository_owner }}
      PACKAGE_NAME: ${{ github.event.repository.name }}
      CURRENT_DIGEST: ${{ needs.build-scan-release.outputs.published-digest }}
      KEEP_SEMVER_COUNT: "5"
    steps:
      - name: Prune stale GHCR versions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 <<'PY'
          import json
          import os
          import re
          import subprocess

          owner = os.environ["OWNER"]
          package = os.environ["PACKAGE_NAME"]
          current_digest = os.environ.get("CURRENT_DIGEST", "")
          keep_semver_count = int(os.environ.get("KEEP_SEMVER_COUNT", "5"))

          def gh(path, method="GET"):
              command = ["gh", "api", "-H", "Accept: application/vnd.github+json", "-H", "X-GitHub-Api-Version: 2022-11-28"]
              if method != "GET":
                  command.extend(["-X", method])
              command.append(path)
              return subprocess.run(command, text=True, capture_output=True)

          def package_base():
              org = gh(f"/orgs/{owner}")
              if org.returncode == 0:
                  return f"/orgs/{owner}/packages/container/{package}/versions"
              return f"/users/{owner}/packages/container/{package}/versions"

          base = package_base()
          versions = []
          page = 1
          while True:
              result = gh(f"{base}?per_page=100&page={page}")
              result.check_returncode()
              batch = json.loads(result.stdout)
              if not batch:
                  break
              versions.extend(batch)
              page += 1

          semver = re.compile(r"^v?\d+\.\d+\.\d+(?:[-+][0-9A-Za-z.-]+)?$")
          artifact = re.compile(r"^sha256-([0-9a-f]{64})\.")

          def tags(version):
              return set(version.get("metadata", {}).get("container", {}).get("tags", []) or [])

          release_tags = sorted(
              {tag for version in versions for tag in tags(version) if semver.match(tag)},
              reverse=True,
          )[:keep_semver_count]
          keep_tags = {"latest", "main", *release_tags}
          current_hex = current_digest.removeprefix("sha256:")
          keep_ids = set()
          keep_digests = {current_hex} if current_hex else set()

          for version in versions:
              version_tags = tags(version)
              digest = version.get("name", "")
              digest_hex = digest.removeprefix("sha256:")
              if version_tags & keep_tags or digest_hex in keep_digests:
                  keep_ids.add(version["id"])
                  if digest_hex:
                      keep_digests.add(digest_hex)

          for version in versions:
              subjects = {match.group(1) for tag in tags(version) if (match := artifact.match(tag))}
              if subjects & keep_digests:
                  keep_ids.add(version["id"])

          deleted = 0
          for version in versions:
              if version["id"] in keep_ids:
                  continue
              result = gh(f"{base}/{version['id']}", method="DELETE")
              if result.returncode != 0:
                  raise RuntimeError(result.stderr or result.stdout)
              deleted += 1

          print(f"Kept {len(keep_ids)} GHCR versions; deleted {deleted} stale versions")
          PY
